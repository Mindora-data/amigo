[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nino-local"
version = "0.8.0"
description = "Local-first NINO memory and autonomy server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Mindora" }
]
dependencies = []

[project.scripts]
nino-server = "nino.server:main"
nino-smoke = "nino.smoke:main"
nino-claude-live = "nino.claude_live:main"
nino-product-audit = "nino.product_audit:main"
nino-eval = "nino.eval_runner:main"
nino-status = "nino.product_status:main"
nino-completion-audit = "nino.completion_audit:main"
nino-closing-report = "nino.closing_report:main"
nino-prod-smoke = "nino.prod_smoke:main"
nino-telegram = "nino.telegram:main"
nino-synthetic-companion = "nino.synthetic_companion:main"
telegram-style-import = "nino.style_import:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
