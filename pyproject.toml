[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nino-local"
version = "0.8.0"
description = "Local-first NINO memory and autonomy server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Mindora" }
]
dependencies = []

[project.scripts]
nino-server = "nino.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
